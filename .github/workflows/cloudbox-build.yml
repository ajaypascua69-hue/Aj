name: CloudBox website and Android APK
on:
  push:
    branches: [main, cloudbox-build]
    paths: ['cloudbox/**', '.github/workflows/cloudbox-build.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Copy web app into Android assets
        run: mkdir -p cloudbox/android/app/src/main/assets/www && cp -r cloudbox/index.html cloudbox/style.css cloudbox/app.js cloudbox/manifest.webmanifest cloudbox/icon.svg cloudbox/sw.js cloudbox/android/app/src/main/assets/www/
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: cloudbox/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CloudBox-debug-apk
          path: cloudbox/android/app/build/outputs/apk/debug/app-debug.apk
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cloudbox
      - uses: actions/deploy-pages@v4
