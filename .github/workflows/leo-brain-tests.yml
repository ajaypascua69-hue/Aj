name: Leo AI Brain Tests
on:
  push:
    paths:
      - "leo-brain/**"
      - ".github/workflows/leo-brain-tests.yml"
  pull_request:
    paths:
      - "leo-brain/**"
      - ".github/workflows/leo-brain-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test Python neural network
        run: python -m unittest discover -s leo-brain/python -v
      - name: Test browser brain module
        run: node leo-brain/test-brain.js
