name: Build Leo AI Android APK

on:
  workflow_dispatch:
    inputs:
      app_source:
        description: Which app should be packaged?
        required: true
        type: choice
        options:
          - leo
          - generated-app
        default: leo
      app_name:
        description: Android app display name
        required: true
        default: Leo AI
        type: string
      app_id:
        description: "Android package ID (example: com.example.myapp)"
        required: true
        default: com.ajaypascua.leoai
        type: string
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'auth.js'
      - 'usb-storage.js'
      - 'auth.css'
      - 'app.js'
      - 'app-builder.js'
      - 'voice-engine.js'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'capacitor.config.json'
      - 'package.json'
      - 'service-worker.js'
      - 'generated-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_SOURCE: ${{ github.event.inputs.app_source || 'auto' }}
      APP_NAME: ${{ github.event.inputs.app_name || 'Leo AI' }}
      APP_ID: ${{ github.event.inputs.app_id || 'com.ajaypascua.leoai' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor
        run: npm install
      - name: Prepare selected app source
        run: |
          mkdir -p www
          if [ "$APP_SOURCE" = "auto" ]; then
            if [ -f generated-app/index.html ]; then APP_SOURCE="generated-app"; else APP_SOURCE="leo"; fi
          fi
          if [ "$APP_SOURCE" = "generated-app" ]; then
            if [ ! -f generated-app/index.html ]; then
              echo "generated-app/index.html is missing. Ask LEO to create the web app files and add them to generated-app/ first."
              exit 1
            fi
            cp -R generated-app/. www/
          else
            cp index.html auth.js auth.css usb-storage.js app.js app-builder.js enhancements.js voice-engine.js style.css manifest.webmanifest icon.svg www/
          fi
          node -e "const fs=require('fs'); const id=process.env.APP_ID; if(!/^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$/.test(id)){throw new Error('Invalid Android package ID: '+id)}; fs.writeFileSync('capacitor.config.json',JSON.stringify({appId:id,appName:process.env.APP_NAME,webDir:'www',android:{allowMixedContent:false}},null,2))"
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Configure Android 16 build tools
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.gradle'); s=p.read_text().replace('com.android.tools.build:gradle:8.7.2','com.android.tools.build:gradle:8.9.1'); p.write_text(s)
          p=Path('variables.gradle'); s=p.read_text().replace('compileSdkVersion = 35','compileSdkVersion = 36').replace('targetSdkVersion = 35','targetSdkVersion = 36'); p.write_text(s)
          p=Path('app/build.gradle'); s=p.read_text()
          if 'signingConfigs {' not in s:
              s=s.replace('android {', '''android {
              signingConfigs { playRelease {
                  if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              } }''', 1)
          s=s.replace('release {', "release { if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.playRelease", 1)
          p.write_text(s)
          PY
      - name: Increase Gradle distribution download timeout
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gradle/wrapper/gradle-wrapper.properties')
          lines = [line for line in p.read_text().splitlines() if not line.startswith('networkTimeout=')]
          lines.append('networkTimeout=120000')
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Build debug APK and release App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release-upload.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-upload.jks
            export ANDROID_KEYSTORE_PATH="$PWD/release-upload.jks"
          fi
          # Retry transient distribution/repository failures.
          for attempt in 1 2 3; do
            if ./gradlew lintRelease assembleDebug bundleRelease --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed on attempt $attempt; retrying after a short delay."
              sleep $((attempt * 20))
            fi
          done
          exit 1
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leo-ai-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Play Store App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: leo-ai-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
