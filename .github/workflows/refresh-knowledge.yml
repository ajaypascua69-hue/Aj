name: Refresh LEO public knowledge feeds

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_knowledge.py'
      - 'knowledge/sources.json'
      - '.github/workflows/refresh-knowledge.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-leo-knowledge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Aj
        uses: actions/checkout@v4
      - name: Fetch allowlisted public feeds
        run: python3 scripts/update_knowledge.py
      - name: Commit changed feed index
        run: |
          if git diff --quiet -- knowledge/auto-feed.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/auto-feed.json
          git commit -m "Refresh LEO public knowledge feeds"
          git push
