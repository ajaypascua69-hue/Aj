name: Build Accessible Android APK

on:
  push:
    paths:
      - 'accessible-android/**'
      - '.github/workflows/accessible-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: accessible-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK to Accessible.apk
        run: cp accessible-android/app/build/outputs/apk/debug/app-debug.apk Accessible.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Accessible-APK
          path: Accessible.apk
          if-no-files-found: error
          retention-days: 30
